name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build custom-domain site
        env:
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PAGES: false
          NEXT_PUBLIC_SITE_URL: https://celoht.com
          NEXT_PUBLIC_USE_PROJECT_BASE_PATH: false
        run: npm run build

      - name: Preserve custom-domain export
        run: mv out out-root

      - name: Build project-path site
        env:
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PAGES: true
          NEXT_PUBLIC_SITE_URL: https://celoht.com
          NEXT_PUBLIC_USE_PROJECT_BASE_PATH: true
        run: npm run build

      - name: Combine both site paths
        run: |
          mv out out-project
          mkdir -p out/celoht-siteweb
          cp -a out-root/. out/
          cp -a out-project/. out/celoht-siteweb/
          rm -rf out-root out-project

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
